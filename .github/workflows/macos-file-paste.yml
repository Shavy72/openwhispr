name: macOS File Paste

# Proves on a real Mac that a file lands on the pasteboard as a file URL
# (fileClipboard.js darwin branch) and that the paste tests pass.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/helpers/fileClipboard.js"
      - "src/helpers/clipboard.js"
      - "test/helpers/fileClipboard.test.js"
      - "test/helpers/pasteFile.test.js"
      - ".github/workflows/macos-file-paste.yml"
  pull_request:
    paths:
      - "src/helpers/fileClipboard.js"
      - "src/helpers/clipboard.js"
      - "test/helpers/fileClipboard.test.js"
      - "test/helpers/pasteFile.test.js"
      - ".github/workflows/macos-file-paste.yml"

permissions:
  contents: read

jobs:
  file-paste:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: File paste tests (real NSPasteboard write + read-back)
        run: node --import tsx --test test/helpers/fileClipboard.test.js test/helpers/pasteFile.test.js test/helpers/clipboardRestore.test.js

      - name: Sample MP3 on the pasteboard, list pasteboard types
        run: |
          node -e 'require("./src/helpers/fileClipboard").writeFileToClipboard(require("path").resolve("assets/test/beispiel.mp3")).then(()=>console.log("written"),e=>{console.error(e);process.exit(1)})'
          osascript -e 'clipboard info'
          osascript -e 'POSIX path of (the clipboard as «class furl»)'

      # Informational: the full suite has locale-dependent failures unrelated to this job.
      - name: Full test suite
        continue-on-error: true
        run: npm test
